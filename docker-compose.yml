# 电网运维 RAG 智能问答系统 - 全栈编排
# S1: mysql + minio | S5: + etcd + milvus-minio + milvus | S11: + backend + frontend
# 一键启动: docker compose up -d --build

services:
  # ---------- MySQL：结构化元数据 ----------
  mysql:
    image: mysql:8.0
    container_name: grid-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-grid_qa}
      MYSQL_USER: ${MYSQL_USER:-grid}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-grid123456}
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"   # 宿主机 3307，避开本机 MySQL
    volumes:
      - mysql-data:/var/lib/mysql
    command:
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root123456}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ---------- MinIO：源文档对象存储 ----------
  minio:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e   # pin-digest（原 minio/minio:latest）
    container_name: grid-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./data/minio:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ---------- etcd：Milvus 元数据依赖 ----------
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: grid-etcd
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - ./data/etcd:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ---------- Milvus 专用对象存储 ----------
  milvus-minio:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e   # pin-digest（原 minio/minio:latest）
    container_name: grid-milvus-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ./data/milvus-minio:/minio_data
    command: minio server /minio_data

  # ---------- Milvus 2.4 向量库 ----------
  milvus:
    image: milvusdb/milvus:v2.4.10
    container_name: grid-milvus
    command: ["milvus", "run", "standalone"]
    restart: unless-stopped
    # 2026-09-07：MinIO 磁盘水位触底 → datanode 写入 panic → 崩溃循环 52 次，
    # WSL crash dump 每次抓 3-4GB（共 28.4GB）把宿主 C 盘塞满。加内存上限防失控。
    mem_limit: 6g
    depends_on:
      - etcd
      - milvus-minio
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
    ports:
      - "19530:19530"
      - "9091:9091"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3

  # ---------- Redis：热点问答缓存 ----------
  redis:
    image: redis:7-alpine
    container_name: grid-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
    command: redis-server --appendonly yes --maxmemory 300mb --maxmemory-policy noeviction --maxmemory-samples 10 --requirepass grid-langfuse-pass
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ---------- Neo4j：知识图谱（设备-故障-处置 多跳推理）----------
  neo4j:
    image: neo4j@sha256:4bae36aff76271e27fd6a6ed0835413f86a284cd179cfb1cb7d188f5f7533aca   # pin-digest（原 neo4j:5-community）
    container_name: grid-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-neo4j123456}
      # 2026-09-07：宿主机异常断电致事务日志尾部损坏（checkpoint 指向无效位置，恢复失败循环重启）。
      # 允许截断损坏尾部抢救启动（KG 三元组在 MySQL KgTriple 有镜像，可重建，风险可控）。
      # 注① internal.* 为未声明内部项，5.x 默认 strict_validation 会拒启；显式放宽校验。
      # 注② docker env 转义规则：_ → . ，__ → _。目标 fail_on_corrupted_log_files（下划线）
      #    必须写 fail__on__corrupted__log__files；写成 fail_on 会被转成 fail.on（不识别）。
      # 注③ 断电后 tx log 文件整体缺失（MissingTransactionLogsCheck 拒启）→ 放行缺失检查
      #    （官方口径 db.recovery.fail_on_missing_files=false，官方 KB 18000369252115；
      #     dbms.recovery.* 为旧名，5.26 识别但报 deprecated）。
      NEO4J_server_config_strict__validation_enabled: "false"
      NEO4J_internal_dbms_tx__log_fail__on__corrupted__log__files: "false"
      NEO4J_db_recovery_fail__on__missing__files: "false"
    ports:
      - "7474:7474"   # Neo4j Browser
      - "7687:7687"   # Bolt 协议
    volumes:
      - ./data/neo4j:/data
    healthcheck:
      # 7474 HTTP 就绪即 Bolt 可用（镜像内无 curl，有 wget）
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ---------- Ollama：本地应急 LLM（云端 qwen/deepseek/doubao 全部不可用时的兜底，非强依赖）----------
  # LLM_FALLBACK_CHAIN 末位新增 ollama；首次启动自动拉取模型（7B q4 量化，约 4.5GB，CPU 可推理）。
  # mem_limit/cpus 防止真实触发兜底、开始推理时把 mysql/milvus/redis/neo4j 挤爆(OOM/CPU 饥饿)；
  # 按部署机器实际配置调整数值。
  ollama:
    image: ollama/ollama@sha256:1685741456770df6e3cceb2a945a5f75e020f658d1701509668d6f4688f1dd3f   # pin-digest（原 ollama/ollama:latest）
    container_name: grid-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ./data/ollama:/root/.ollama
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "ollama serve & sleep 3 && ollama pull ${OLLAMA_MODEL:-qwen2.5:7b-instruct-q4_K_M} && wait"
    mem_limit: 10g
    cpus: 4

  # ---------- Nacos：配置中心（可选，CONFIG_SOURCE=nacos 时启用；默认 env 不依赖）----------
  # 启动: docker compose up -d nacos ；管理台 http://localhost:8848/nacos (默认 nacos/nacos)
  nacos:
    image: nacos/nacos-server:v2.4.3
    container_name: grid-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      # 容器内 InetUtils.refreshIp NPE（枚举不到可用 IP）→ 显式指定服务 IP（2026-09-03）
      NACOS_SERVER_IP: 172.18.0.20
    ports:
      - "8848:8848"
      - "9848:9848"
    volumes:
      - ./data/nacos:/home/nacos/data
    networks:
      default:
        ipv4_address: 172.18.0.20

  # ---------- 后端 ----------
  backend:
    build:
      context: ./backend
      args:
        - HTTP_PROXY=http://host.docker.internal:7897
        - HTTPS_PROXY=http://host.docker.internal:7897
        - BGE_PRELOAD=false
    container_name: grid-backend
    restart: unless-stopped
    env_file: .env                     # API keys / 开关注入（environment 块优先级更高，覆盖连接串等）
    depends_on:
      # 强依赖：必须健康才起后端（防"依赖崩溃循环、后端照常启动、功能静默降级"）
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
      milvus:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      # 弱依赖：本地兜底 LLM，起了就行（镜像无 curl/wget 可做探活）
      ollama:
        condition: service_started
    environment:
      # 容器内用 service name + 内部端口连接（覆盖 .env 的 localhost）
      DATABASE_URL: mysql+aiomysql://grid:grid123456@mysql:3306/grid_qa?charset=utf8mb4
      REDIS_URL: redis://:grid-langfuse-pass@redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MILVUS_HOST: milvus
      NEO4J_URI: bolt://neo4j:7687
      # 容器内 localhost 指自身，OTLP 走 compose 服务名（langfuse 内部 3000→宿主 3001）；
      # 用 OTEL_EXPORTER_OTLP_ENDPOINT，代码会自动拼 /v1/traces（OTEL_ENDPOINT 不会拼→404）
      OTEL_EXPORTER_OTLP_ENDPOINT: http://langfuse:3000/api/public/otel
      LANGFUSE_PUBLIC_KEY: pk-lf-751194e4-12a2-407b-b54f-f153b02c79be
      LANGFUSE_SECRET_KEY: sk-lf-6396f6d5-d0e5-424d-af6e-363f3368ae57
      MCP_SERVERS: '[{"name":"mock_scada","url":"http://mock-scada:9100"}]'   # N2 启动发现 mock SCADA → 注册 query_telemetry 到 agent ToolRegistry
      # 问答→行动闭环（create_ticket/submit_ticket 工具 + ops_planner persona + 工单流转事件）；关=现状
      TICKET_ACTION_LOOP_ENABLE: "true"
      # 链路节点详情（瀑布图 attrs：参数/prompt 采集；关=现状只记耗时；纯观测不进缓存版本）
      QA_TRACE_DETAIL_ENABLE: "true"
      # 主动运维闭环补全（结构化根因 + 遥测证据 + 闭环回填）；关=现状
      PROACTIVE_SCHEMA_V2_ENABLE: "true"
      PROACTIVE_TELEMETRY_ENABLE: "true"
      PROACTIVE_FEEDBACK_ENABLE: "true"
      # 容器直连外网：云API(dashscope/deepseek/doubao 国内可达) + bge 走 hf-mirror 国内镜像。
      # 注：宿主机代理 7897 仅监听 127.0.0.1（未开 Allow LAN），容器经 host.docker.internal 连不上，
      # 故不设 HTTPS_PROXY——否则 httpx/requests 把所有出站（含 hf-mirror、云API）都发往不可达代理。
      HF_ENDPOINT: https://hf-mirror.com
      HF_HUB_OFFLINE: "1"            # 离线模式：用挂载的宿主机 HF 缓存，避免联网下载受阻
      TRANSFORMERS_OFFLINE: "1"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8001:8001"
    volumes:
      - grid-backend-data:/app/data   # 持久化 data/（运行日志 + 数据备份 .sql），容器重建不丢
      - ./scripts:/app/scripts:ro     # eval_matrix API 触发的 CLI 工具（只读；工具目录非源码热载）
      - ./reports:/app/reports        # 评测矩阵报告落宿主 reports/（系统管理-评测矩阵可浏览）
      - C:/Users/Administrator/.cache/huggingface/hub:/root/.cache/huggingface/hub:ro   # 宿主机 bge 缓存（离线加载，免下载）

  # ---------- Mock SCADA MCP Server（N2 MCP 总线外部 SCADA 数据源，侧车）----------
  # 复用 backend 镜像跑 mock_scada_server（真实 SCADA 接入时换连接器即可）。
  # backend 经 MCP_SERVERS=http://mock-scada:9100 发现并注册 query_telemetry 等工具到 agent ToolRegistry。
  mock-scada:
    image: rag-backend:latest
    build:
      context: ./backend
      args:
        - BGE_PRELOAD=false
    container_name: grid-mock-scada
    restart: unless-stopped
    command: python -m app.mcp.mock_scada_server
    ports:
      - "9100:9100"

  # ---------- 前端（nginx）----------
  frontend:
    build:
      context: ./frontend
      args:
        - HTTP_PROXY=http://host.docker.internal:7897
        - HTTPS_PROXY=http://host.docker.internal:7897
    container_name: grid-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

  # ---------- Prometheus 指标采集 ----------
  # 注：采集本地 uvicorn(host.docker.internal:8001)，不依赖 backend 容器
  prometheus:
    image: prom/prometheus@sha256:c6b27ea434f8389bfe233fbc7be381cf50587c286e871bc842008f5a1b1908a7   # pin-digest（原 prom/prometheus:latest）
    container_name: grid-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./data/prometheus:/prometheus

  # ---------- Grafana 可视化仪表盘（好看的开箱监控界面）----------
  grafana:
    image: grafana/grafana@sha256:121a7a9ece6dc10b969f1f96eed64b4f07dfac0d0b8abc070f7cb83bbde86f63   # pin-digest（原 grafana/grafana:latest）
    container_name: grid-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./data/grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

  # ---------- Langfuse：LLM trace 可视化（N4）----------
  langfuse:
    # 钉到 v3 大版本（:latest 会静默升到新大版本导致再次缺依赖崩溃）
    image: langfuse/langfuse@sha256:60a668b1dd06e2d9a034ba8b2ed5e84303e66c6202d76b288020059a755fd037   # pin-digest（原 langfuse/langfuse:3）
    container_name: grid-langfuse
    restart: unless-stopped
    depends_on:
      - postgres-langfuse
      - clickhouse
      - redis
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@postgres-langfuse:5432/langfuse
      # Langfuse v3 强依赖 ClickHouse(主存储) + Redis(队列)，缺任一启动即失败
      # 3.x 要求显式 CLICKHOUSE_USER/PASSWORD（不只看 URL），与 clickhouse 容器账号对齐
      # 单节点 ClickHouse：CLICKHOUSE_CLUSTER_ENABLED=false 关闭 ON CLUSTER 迁移（免 keeper/集群）
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse:langfuse@clickhouse:9000/langfuse
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_PASSWORD: langfuse
      CLICKHOUSE_DB: langfuse
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      CLICKHOUSE_MIGRATE: "true"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_AUTH: "grid-langfuse-pass"
      # 该 v3 构建把 S3 事件上传桶名设为必填；先给占位值，事件上传可后续接 MinIO
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse-events
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minioadmin
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: minioadmin
      LANGFUSE_S3_EVENT_UPLOAD_REGION: us-east-1
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      # 媒体上传也走同一个 MinIO bucket
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse-events
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minioadmin
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: minioadmin
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: us-east-1
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-langfuse-secret-2026}
      NEXTAUTH_URL: http://localhost:3001
      SALT: ${LANGFUSE_SALT:-langfuse-salt-2026}
      NEXT_PUBLIC_SIGNUP_DISABLED: "false"
    ports:
      - "3001:3000"   # Langfuse UI（避开 Grafana 的 3000）
    volumes:
      - ./data/langfuse:/data

  # ---------- Langfuse 专用 PostgreSQL ----------
  postgres-langfuse:
    image: postgres:15-alpine
    container_name: grid-langfuse-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes:
      - ./data/langfuse-db:/var/lib/postgresql/data

  # ---------- Langfuse 专用 ClickHouse（v3 主存储，仅 langfuse 内部访问，不暴露端口）----------
  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    container_name: grid-langfuse-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: langfuse
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_PASSWORD: langfuse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse-data:/var/lib/clickhouse


  # ---------- Langfuse Worker（v3 事件处理：消费 Redis 队列 → 写 S3 + ClickHouse）----------
  langfuse-worker:
    image: langfuse/langfuse-worker@sha256:138a5b510cd76262a2abb02af1ddc563105013fdc9a62e63ccce526140ad05ba   # pin-digest（原 langfuse/langfuse-worker:3）
    container_name: grid-langfuse-worker
    restart: unless-stopped
    depends_on:
      - postgres-langfuse
      - clickhouse
      - redis
      - langfuse
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@postgres-langfuse:5432/langfuse
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse:langfuse@clickhouse:9000/langfuse
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_PASSWORD: langfuse
      CLICKHOUSE_DB: langfuse
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      CLICKHOUSE_MIGRATE: "false"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_AUTH: "grid-langfuse-pass"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse-events
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minioadmin
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: minioadmin
      LANGFUSE_S3_EVENT_UPLOAD_REGION: us-east-1
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse-events
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minioadmin
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: minioadmin
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: us-east-1
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-langfuse-secret-2026}
      SALT: ${LANGFUSE_SALT:-langfuse-salt-2026}
    command: ["node", "--max-old-space-size=1024", "/app/worker/dist/index.js"]

volumes:
  mysql-data:
  grid-backend-data:
  clickhouse-data:

